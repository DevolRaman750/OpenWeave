[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openweave-core"
version = "1.0.0"
description = "Anomaly detection, incident classification and deep evaluation for AI agents and multi-agent systems."
readme = "DEPLOYMENT.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "numpy>=1.26,<3.0",
    "anthropic>=0.40,<1.0",
    "openai>=1.40,<2.0",
]

[project.optional-dependencies]
research = ["scipy>=1.11", "matplotlib>=3.8"]

[project.scripts]
openweave-observer = "openweave_core.observer.daemon:main"

[tool.setuptools.packages.find]
include = ["openweave_core*"]
exclude = ["openweave_core.adaptive_baseline.Adaptive-Multi-Dimensional-Monitoring*"]
